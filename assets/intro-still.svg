<svg xmlns="http://www.w3.org/2000/svg" width="780" height="236" viewBox="0 0 780 236" role="img" aria-labelledby="title description">
  <title id="title">Hi, I’m Boss</title>
  <desc id="description">Boss’s GitHub introduction. Animated roles: Data Science Student, AI &amp; Computer Vision Enthusiast, Software Developer, Full-Stack Developer.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop stop-color="#0F172A"/><stop offset="1" stop-color="#1C183B"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="18%" r="65%">
      <stop stop-color="#7C3AED" stop-opacity=".25"/><stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M0 30V0H30" fill="none" stroke="#A78BFA" stroke-opacity=".065"/>
    </pattern>
    <linearGradient id="accent"><stop stop-color="#7C3AED"/><stop offset="1" stop-color="#C4B5FD"/></linearGradient>
    <clipPath id="surface"><rect x=".5" y=".5" width="779" height="235" rx="22"/></clipPath>

  </defs>
  <style>
    .role-type {font-family: ui-monospace, SFMono-Regular, Consolas, Liberation Mono, monospace; font-size: 31px; fill: #A78BFA}
    @media (prefers-reduced-motion: reduce) {.motion {display:none} .still {opacity:1 !important}}
  </style>
  <g clip-path="url(#surface)">
    <rect width="780" height="236" fill="url(#background)"/>
    <rect width="780" height="236" fill="url(#glow)"/>
    <rect width="780" height="236" fill="url(#grid)"/>
    <path d="M0 192H55L104 236M780 192H725L676 236" fill="none" stroke="#A78BFA" stroke-opacity=".19"/>
    <path d="M0 211H43L68 236M780 211H737L712 236" fill="none" stroke="#A78BFA" stroke-opacity=".10"/>
  </g>
  <rect x=".5" y=".5" width="779" height="235" rx="22" fill="none" stroke="#594A84"/>
  <rect x="354" y="1" width="72" height="2" rx="1" fill="url(#accent)"/>
  <text x="390" y="58" text-anchor="middle" font-family="ui-monospace, Consolas, monospace" font-size="17" font-weight="600" letter-spacing="2.8" fill="#C4B5FD">@YOSHIOKA1311</text>
  <text x="390" y="127" text-anchor="middle" font-family="system-ui, Segoe UI, Arial, sans-serif" font-size="57" font-weight="680" letter-spacing="-2" fill="#E2E8F0">Hi, I’m <tspan fill="#C4B5FD">Boss</tspan></text>
  <text x="390" y="187" class="role-type still" text-anchor="middle" opacity="1">Data Science Student</text>
  <g class="role-type motion"></g>
</svg>
