name: Refresh profile statistics

on:
  schedule:
    - cron: '37 18 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/refresh-profile.yml'
      - 'scripts/refresh_profile.py'
      - 'scripts/activity.html'

permissions:
  contents: write

concurrency:
  group: profile-statistics
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Refresh the public contribution calendar
        env:
          PROFILE_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/refresh_profile.py --username "$PROFILE_LOGIN"
      - name: Publish updated activity
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/activity.svg assets/activity-compact.svg docs/index.html
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Refresh GitHub profile statistics'
          git push origin "HEAD:$TARGET_BRANCH"
